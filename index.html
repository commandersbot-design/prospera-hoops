<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/png/prosperahoops-symbol-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prospera Hoops · The DMV's scouting system of record</title>
    <meta name="description" content="Prospera Hoops — a complete, trustworthy read on any DMV high school basketball player or team. The whole DMV, tracked over time, with an honest eval." />
    <meta name="theme-color" content="#0B0E13" />
    <meta property="og:title" content="Prospera Hoops" />
    <meta property="og:description" content="The DMV's scouting system of record — every player, every team, tracked over time." />
    <meta property="og:image" content="/brand/png/prosperahoops-lockup-dark-1600w.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body { margin: 0; padding: 0; background: #0B0E13; }
      body {
        font-family: 'Manrope', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #cbd5e1;
      }
      #loading {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        background: #050a12; z-index: 9999;
      }
      #loading .brand {
        font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px; letter-spacing: 0.32em; color: #FF6A1A;
        text-transform: uppercase; font-weight: 700;
      }
      #loading .sub {
        font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
        font-size: 9px; letter-spacing: 0.24em; color: #475569; text-transform: uppercase;
      }
      #loading .pulse {
        width: 36px; height: 1px; background: #FF6A1A; opacity: 0.5;
        animation: prospera-pulse 1.2s ease-in-out infinite;
      }
      @keyframes prospera-pulse {
        0%, 100% { opacity: 0.15; transform: scaleX(0.4); }
        50%      { opacity: 0.85; transform: scaleX(1); }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <img src="/brand/svg/prosperahoops-symbol.svg" alt="Prospera Hoops" width="72" height="72" />
      <div class="pulse"></div>
      <div class="sub">Loading the DMV scouting board…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
